name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semVersie.outputs.tag }}
      release: ${{ steps.semVersie.outputs.release }}
      prerelease: ${{ steps.semVersie.outputs.prerelease }}
      release_notes: ${{ steps.semVersie.outputs.release-notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate version
        id: semVersie
        uses: RonaldPhilipsen/semVersie@41233349edfb40f4e6da4251fea7684026182dc9 # v2.3.4

  release:
    if: ${{ needs.version.outputs.release == 'true' }}
    needs:
      - version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to be able to push tags and create releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Tag Release
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git push origin "$TAG"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_NOTES: ${{ needs.version.outputs.release_notes }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = 'true' ]; then
            gh release create "$TAG" --title "$TAG" --notes "$RELEASE_NOTES" --prerelease
          else
            gh release create "$TAG" --title "$TAG" --notes "$RELEASE_NOTES"
          fi
